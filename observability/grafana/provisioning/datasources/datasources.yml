apiVersion: 1

datasources:
  - name: FleetPostgreSQL
    uid: fleet-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: fleet_admin
    secureJsonData:
      password: fleet_password
    jsonData:
      database: fleet_telemetry
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true

  - name: MiniStackCloudWatch
    uid: ministack-cloudwatch
    type: cloudwatch
    access: proxy
    jsonData:
      authType: keys
      defaultRegion: us-east-1
      endpoint: http://ministack:4566
      customMetricsNamespaces: FleetTelemetry
    secureJsonData:
      accessKey: test
      secretKey: test
    editable: true

